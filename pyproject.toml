[project]
name = "puppy-pad-alarm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "truonghm", email = "10404416+truonghm@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.161",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
